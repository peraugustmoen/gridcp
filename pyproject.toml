[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcp"
version = "0.1.0"
description = "Grid-based online changepoint detection in Python"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "numba>=0.57",
  "scipy>=1.7",
  "cloudpickle>=3.0",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
  "ruff",
  "pre-commit",
    "ipykernel",
    "nbformat>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/yourname/gridcp"

[tool.setuptools.packages.find]
include = ["gridcp*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.ruff]
line-length = 88
extend-exclude = ["gridcp/old_api"]

[tool.ruff.lint]
select = ["E", "F", "D"]  # errors, flakes, docstring rules
ignore = ["E501"]       # long lines are handled pragmatically by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"gridcp/old_api/**/*.py" = ["D"]
"notebooks/*.ipynb" = ["D", "F401", "F811"]
"old_notebooks/*.ipynb" = ["D", "E", "F"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # or "pep257", "google", etc.

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "gridcp/old_api_tests",

]

