[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcp"
version = "0.1.1"
description = "Grid-based online changepoint detection in Python"
authors = [
  { name = "Per August J. Moen", email = "pamoen@math.uio.no" },
  { name = "Sebastian G. Nielsen", email = "sebasgni@math.uio.no" },
  { name = "Espen B. Urheim", email = "espenbur@math.uio.no" },
  { name = "Martin Tveten", email = "tveten@nr.no" },
  { name = "Ingrid K. Glad", email = "glad@math.uio.no" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
  "changepoint",
  "change detection",
  "online",
  "streaming",
  "sequential",
  "time series",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.23",
  "numba>=0.57",
  "scipy>=1.7",
  "cloudpickle>=3.0",
]


[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "pre-commit",
]

[project.urls]
Homepage = "https://github.com/peraugustmoen/gridcp"
Repository = "https://github.com/peraugustmoen/gridcp"
Issues = "https://github.com/peraugustmoen/gridcp/issues"

[tool.setuptools.packages.find]
include = ["gridcp*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "D"]  # errors, flakes, docstring rules
ignore = ["E501"]       # long lines are handled pragmatically by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # or "pep257", "google", etc.

[tool.pytest.ini_options]
testpaths = ["tests"]
