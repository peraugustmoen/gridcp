[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridcp"
version = "0.1.0"
description = "Grid-based online changepoint detection in Python"
authors = [
  { name = "Your Name", email = "you@example.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "numba>=0.57",
]

[project.urls]
Homepage = "https://github.com/yourname/gridcp"
