repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        name: ruff check (full)
        args: [gridcp, tests]
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check (full)
        args: [--check, gridcp, tests]
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pytest-pre-commit
        name: pytest with coverage (pre-commit)
        entry: .venv/bin/python -m pytest --cov=gridcp --cov-report=term-missing
        language: system
        pass_filenames: false
        stages: [pre-commit]
